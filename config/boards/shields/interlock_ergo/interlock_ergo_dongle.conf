# ZMK Wireless Dongle Configuration (Central Receiver)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# High transmit power for RF link
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase max BLE connections to support 2 peripherals + multiple host profiles
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8

# Act as USB HID device
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Proxy battery status from both peripherals to OS
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
