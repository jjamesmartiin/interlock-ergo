# Power and BLE settings for right peripheral
# No CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_* here: those are gated on
# ZMK_SPLIT_ROLE_CENTRAL and are dropped on a peripheral. They live in
# interlock_ergo_dongle.conf, which is the central.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORTING=y
