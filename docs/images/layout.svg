<text x="34" y="639.8394614189539" font-size="14.5" fill="#4a5561">Case 175.1 x 137.6 mm left, 211.1 x 137.6 mm right, docked 386.2 mm wide. Plate 1.2 mm, case 14.2 mm tall.</text>
<text x="34" y="660.8394614189539" font-size="14.5" fill="#4a5561">Stagger 0 / 0.5 / 0.75 / 1.25 / 0.25 u keeps every letter column on its GH60 x; the 22.5 mm of shear it needs is the dead strip at each half's seam edge.</text>
<text x="34" y="681.8394614189539" font-size="14.5" fill="#4a5561">Centre of "5" to centre of "6": 69.1 mm (3.8 u) on every row - that is the docked centre gap, not 1.5 u.</text>
<text x="34" y="702.8394614189539" font-size="14.5" fill="#4a5561">Red outline marks the 6-Y-H-N column: 6, Y, H and N all fall on the right half.</text>
