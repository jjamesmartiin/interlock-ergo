<text x="34" y="640.523628462792" font-size="21" font-weight="600" fill="#1f2933">Interlock Ergo - Kailh Choc v1 layout, 71 keys</text>
<text x="34" y="666.523628462792" font-size="14.5" fill="#4a5561">Case 157.1 x 137.6 mm left, 211.1 x 137.6 mm right, docked 368.2 mm wide. Plate 1.2 mm, case 14.2 mm tall.</text>
<text x="34" y="687.523628462792" font-size="14.5" fill="#4a5561">Stagger 0 / 0.5 / 0.75 / 1.25 / 0.25 u is GH60's own stagger (its letters sit at 1 / 1.5 / 1.75 / 2.25 u), shifted 1 u right by the left function column; the 22.5 mm of shear it needs is the dead strip at each half's seam edge.</text>
<text x="34" y="708.523628462792" font-size="14.5" fill="#4a5561">Centre of "5" to centre of "6": 69.1 mm (3.8 u) on every row - that is the docked centre gap, not 1.5 u.</text>
<text x="34" y="729.523628462792" font-size="14.5" fill="#4a5561">Red outline marks the 6-Y-H-N column: 6, Y, H and N all fall on the right half.</text>
